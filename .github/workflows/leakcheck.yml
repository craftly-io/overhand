name: leakcheck
# Every push and pull request, docs included: a client or personal name must never land in this public repo.
# The deny-list is the PUBLIC_DENYLIST secret, so pull requests from forks (no secrets) skip it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: {}
jobs:
  leakcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun release/leakcheck.ts
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
