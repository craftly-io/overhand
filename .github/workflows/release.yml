# Publishes a GitHub release with every platform's package when a version tag (v1.2.3) is pushed. Only an admin can push
# one (the repository's tag ruleset), and that's release/launch.ts.
# Each job holds only what it needs: the build reads, the signature takes GitHub's identity and nothing else, and only
# the last job, which installs and runs nothing of the repo's, may write the release. Actions are pinned by commit.
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  # the Mac menu bar item's helper (apps/menubar), one binary for Apple silicon and Intel; it needs a Mac to build
  menubar:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: swift build -c release --arch arm64 --arch x86_64 --package-path apps/menubar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: menubar
          path: apps/menubar/.build/apple/Products/Release/overhand-menubar
  build:
    needs: menubar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: The tag matches package.json's version
        run: |
          want="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version ($want); the binary would report the wrong version."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: menubar
          path: release/menubar
      - run: chmod +x release/menubar/overhand-menubar
      - run: bun release/build.ts release/out
        env:
          MENUBAR: release/menubar/overhand-menubar
      - run: bash release/smoke.sh release/out/overhand-linux-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: |
            release/out/*.tar.gz
            release/out/SHA256SUMS
  # SHA256SUMS signed with Sigstore, keyless: the certificate names this workflow at this tag, so no key is stored, and
  # the installer checks it with cosign (release/install.sh SIGNER). Checked here too, with the installer's own rule.
  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: out
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign-blob --yes --bundle out/SHA256SUMS.sigstore.json out/SHA256SUMS
      - run: |
          cosign verify-blob --bundle out/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com out/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signature
          path: out/SHA256SUMS.sigstore.json
  release:
    needs: sign
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes out/*.tar.gz out/SHA256SUMS out/SHA256SUMS.sigstore.json
        env:
          GH_TOKEN: ${{ github.token }}
  # `npx overhand`: the launcher in release/npm, at this tag's version. It downloads the public copy of the release files
  # (get.overhand.dev/download, this release's files); a re-run skips a version npm already has. Trusted publishing:
  # npm takes this workflow's GitHub identity (id-token: write), no token is stored, and the package gets provenance.
  # No environment here yet: npm's trusted-publisher entry would have to name it first (npmjs.com → overhand → Settings).
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: release/npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # npm 11.5 or later proves who it is with GitHub's OIDC token (trusted publishing): no npm token is stored
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: |
          v="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "overhand@$v" version 2>/dev/null)" = "$v" ]; then echo "overhand@$v is already on npm"; exit 0; fi
          cp ../../LICENSE.md .
          npm version "$v" --no-git-tag-version --allow-same-version
          npm publish --access public
