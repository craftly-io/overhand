<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="{{paper}}">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="{{paperNight}}">
<!-- the site follows the computer's light or dark: form controls and scrollbars too -->
<meta name="color-scheme" content="light dark">
<!-- the mark, Hand over: written by packages/themes/build-brand.ts from brand.ts -->
<link rel="icon" href="{{root}}favicon-32.png" sizes="32x32">
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">
<!-- Atkinson Hyperlegible Next for every word, Atkinson Hyperlegible Mono for data: self-hosted, one file per weight -->
<link rel="preload" as="font" type="font/woff2" href="{{root}}fonts/atkinson-next-latin-400.woff2" crossorigin>
<link rel="stylesheet" href="{{root}}fonts/atkinson.css">
<link rel="stylesheet" href="{{root}}system.css">
<link rel="stylesheet" href="{{root}}site.css">
<!-- Cloudflare Web Analytics: cookieless page views, no personal data; the token is public. This tag is the only one:
     the zone's automatic setup (which also injected a second beacon that posts to a /cdn-cgi/rum this site answers 404) stays off -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "45a4cc75ccb9444596100c46d2ea9d4a"}'></script>
